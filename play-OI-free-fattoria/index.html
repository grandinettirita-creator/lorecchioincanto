<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alla Fattoria</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E8F0FF;font-family:system-ui,sans-serif;padding:12px;max-width:480px;margin:0 auto}
 .header{text-align:center;position:relative;padding:10px 0}
 .header h1{color:#1E5DFF;font-size:42px;font-weight:900;line-height:.9}
 .header h2{color:#1E5DFF;font-size:19px;font-weight:600}
 .card-fattoria{background:#D6EEFF;border-radius:26px;padding:14px;position:relative;overflow:hidden;min-height:230px}
 .prato{position:absolute;bottom:0;left:0;right:0;height:110px;background:#B8E6A0}
 .fienile{position:relative;z-index:2;width:200px;margin:50px auto 0;background:#FF4D4D;border-radius:6px;padding:10px;border:3px solid #fff;text-align:center}
 .animali-row{position:relative;z-index:3;display:flex;gap:8px;justify-content:center;margin-top:8px}
 .animale-card{background:#fff;border-radius:22px;padding:8px;width:104px;text-align:center;border:2px solid #222;box-shadow:0 4px 0 #222;cursor:pointer}
 .animale-card.wrong{animation:shake.4s}
 .animale-card.hint{animation:wiggle.6s 2}
 .animale-card button{background:#222;color:#fff;border:none;border-radius:20px;padding:6px 10px;font-size:12px;font-weight:800;width:90%;margin-top:6px}
 .domanda{background:#fff;border-radius:22px;padding:14px;display:flex;gap:12px;margin-top:14px}
 .messaggio{margin-top:12px;background:#fff;border:2px solid #222;border-radius:18px;padding:14px;display:flex;gap:10px;animation:pop.3s}
 .messaggio.errore{background:#FFD6DD}
 .messaggio.aiuto{background:#FFF4A0}
 .btn-viola{width:100%;background:#7C5CFF;color:#fff;border:2px solid #222;border-radius:22px;padding:18px;font-size:20px;font-weight:900;margin-top:14px;box-shadow:0 6px 0 #222;cursor:pointer}
 .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
 .btn-bianco{background:#fff;border:2px solid #222;border-radius:22px;padding:12px;font-weight:700;box-shadow:0 4px 0 #222;cursor:pointer}
 .overlay-bravo{position:fixed;inset:0;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;z-index:50}
 .bravo-box{background:#fff;border:3px solid #222;border-radius:24px;padding:22px;text-align:center;box-shadow:0 8px 0 #222}
 .confetto{position:fixed;top:-10px;width:10px;height:14px;animation:caduta linear forwards;z-index:100}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  @keyframes wiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
  @keyframes caduta{0%{transform:translateY(-10px) rotate(0)}100%{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="header">
  <div style="position:absolute;top:0;right:10px;font-size:68px">☀️</div>
  <h1>Alla<br>Fattoria</h1>
  <h2>Tocca, ascolta e indovina!</h2>
</div>

<div class="card-fattoria">
  <div class="prato"></div>
  <div style="position:absolute;top:14px;left:20px;font-size:28px">☁️</div>
  <div class="fienile">❤️</div>
  <div class="animali-row">
    <div class="animale-card" id="card-mucca" onclick="controlla('mucca')"><div style="font-size:42px">🐄<br><span style="font-size:14px">🌼</span></div><button>MUCCA</button></div>
    <div class="animale-card" id="card-maialino" onclick="controlla('maialino')"><div style="font-size:42px">🐷<br><span style="font-size:14px">🍓</span></div><button>MAIALINO</button></div>
    <div class="animale-card" id="card-gallo" onclick="controlla('gallo')"><div style="font-size:42px">🐔<br><span style="font-size:14px">🌽</span></div><button>GALLO</button></div>
  </div>
</div>

<div class="domanda"><div style="font-size:26px">👂</div><p style="font-weight:800">Quale animale fa questo verso?</p></div>
<div id="messaggio-area"></div>
<button class="btn-viola" onclick="suonaSegreto()">🔊 Chi è?</button>
<div class="row2">
  <button class="btn-bianco" onclick="aiutami()">💡 Aiutami</button>
  <button class="btn-bianco" onclick="suonaSegreto()">🔊 Riascolta</button>
</div>

<script>
// I TUOI MP3 VERI - controlla che i nomi siano giusti!
const suoni = {
  mucca: new Audio('mucca.mp3'),
  maialino: new Audio('maialino.mp3'),
  gallo: new Audio('gallo.mp3')
};
let animaleSegreto = null;
let messaggioTimer = null;

function scegliNuovoSegreto(){
  const animali = ['mucca','maialino','gallo'];
  animaleSegreto = animali[Math.floor(Math.random()*animali.length)];
}
function suonaSegreto(){
  if(!animaleSegreto) scegliNuovoSegreto();
  suoni[animaleSegreto].currentTime = 0;
  suoni[animaleSegreto].play();
}
function mostraMessaggio(testo, tipo){
  clearTimeout(messaggioTimer);
  const area = document.getElementById('messaggio-area');
  area.innerHTML = '<div class="messaggio '+tipo+'"><p style="font-weight:800;font-size:14px">'+testo+'</p></div>';
  messaggioTimer = setTimeout(()=>{ area.innerHTML=''; }, 4000);
}
function controlla(cliccato){
  if(!animaleSegreto) scegliNuovoSegreto();
  if(cliccato === animaleSegreto){
    suoni[animaleSegreto].play();
    // coriandoli
    for(let i=0;i<40;i++){
      const c=document.createElement('div');
      c.className='confetto';
      c.style.left=Math.random()*100+'vw';
      c.style.background=['#FF4D4D','#FFD93D','#7C5CFF','#4DFF88','#4DB8FF'][Math.floor(Math.random()*5)];
      c.style.animationDuration=(1.2+Math.random()*1.5)+'s';
      document.body.appendChild(c);
      setTimeout(()=>c.remove(),3000);
    }
    const overlay=document.createElement('div');
    overlay.className='overlay-bravo';
    overlay.innerHTML='<div class="bravo-box"><div style="font-size:42px">🎉</div><div style="font-weight:900;font-size:22px">Bravissimo!</div><div style="font-weight:800">Era proprio il '+animaleSegreto.toUpperCase()+'! 🎉</div></div>';
    document.body.appendChild(overlay);
    setTimeout(()=>{overlay.remove();scegliNuovoSegreto();document.getElementById('messaggio-area').innerHTML='';},2200);
  }else{
    document.getElementById('card-'+cliccato).classList.add('wrong');
    setTimeout(()=>document.getElementById('card-'+cliccato).classList.remove('wrong'),400);
    mostraMessaggio('No, non è lui...<br>Ascolta meglio, ritenta! 👂','errore');
    setTimeout(()=>{suonaSegreto();},800);
  }
}
function aiutami(){
  if(!animaleSegreto) scegliNuovoSegreto();
  document.getElementById('card-'+animaleSegreto).classList.add('hint');
  setTimeout(()=>document.getElementById('card-'+animaleSegreto).classList.remove('hint'),1200);
  mostraMessaggio('Guarda bene... si muove un pochino! ✨','aiuto');
}
scegliNuovoSegreto();
</script>
</body>
</html>
