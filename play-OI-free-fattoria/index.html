<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>l'Orecchio inCanto</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFF8EE;font-family:'Nunito',sans-serif;max-width:430px;margin:0 auto;padding:14px}
.card-top{position:relative;background:#C9E8FF;border-radius:26px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 #E8DCC8;min-height:380px}
.nuv{position:absolute;top:14px;left:14px;width:86px;height:40px;background:#fff;border-radius:30px;z-index:1}
.nuv2{position:absolute;top:44px;left:110px;width:56px;height:26px;background:#fff;border-radius:20px;z-index:1;opacity:.9}
.sole-wrap{position:absolute;top:6px;right:8px;width:90px;height:90px;z-index:2;animation:gira 12s linear infinite}
@keyframes gira{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sole{width:66px;height:66px;background:#FFD93D;border-radius:50%;margin:12px;position:relative;display:flex;align-items:center;justify-content:center}
.raggio{position:absolute;background:#FFD93D;border-radius:3px}
.r1{width:12px;height:4px;top:-6px;left:50%;transform:translateX(-50%)} .r2{width:12px;height:4px;bottom:-6px;left:50%;transform:translateX(-50%)}
.r3{width:4px;height:12px;left:-6px;top:50%;transform:translateY(-50%)} .r4{width:4px;height:12px;right:-6px;top:50%;transform:translateY(-50%)}
.r5{width:10px;height:4px;top:2px;right:2px;transform:rotate(45deg)} .r6{width:10px;height:4px;bottom:2px;left:2px;transform:rotate(45deg)}
.r7{width:10px;height:4px;top:2px;left:2px;transform:rotate(-45deg)} .r8{width:10px;height:4px;bottom:2px;right:2px;transform:rotate(-45deg)}
.sole .faccia{line-height:1;text-align:center}
.sole .occhi{font-size:10px;letter-spacing:4px}
.sole .guance{display:flex;justify-content:space-between;width:28px;margin:1px auto 0}
.sole .guance span{width:6px;height:4px;background:#FF8FA8;border-radius:50%;display:block}
.sole .bocca{font-size:14px;margin-top:-1px}
.fienile-wrap{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);z-index:2}
.fienile{width:190px;height:54px;background:#FF4B4B;border:3px solid #fff;border-bottom:none;border-radius:6px 6px 0 0;position:relative}
.tetto{position:absolute;top:-16px;left:-8px;right:-8px;height:18px;background:#fff;clip-path:polygon(0 100%,50% 0,100% 100%)}
.cuore{position:absolute;top:-6px;left:50%;transform:translateX(-50%);background:#fff;width:18px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px}
.fin{position:absolute;top:12px;width:28px;height:28px;background:#C9E8FF;border:2px solid #fff;border-radius:50%}
.fin.sx{left:10px} .fin.dx{right:10px}
.porta{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:34px;background:#FFF2B2;border:2px solid #fff;border-bottom:none;border-radius:10px 10px 0 0}
.prato{position:absolute;bottom:0;left:0;right:0;height:108px;background:#C8E8A0;z-index:1}
.animali{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:10px;justify-content:center;padding:0 10px;z-index:3}
.an-card{width:112px;background:#fff;border-radius:22px;padding:8px 8px 10px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.08);border:1.5px solid #fff;cursor:pointer;position:relative;transition:transform .15s}
.an-card:active{transform:translateY(2px)}
.an-card.wrong{animation:tremolio .5s}
.an-card.hint{animation:wiggle .6s 2}
@keyframes tremolio{0%,100%{transform:translateX(0)}15%{transform:translateX(-8px)}30%{transform:translateX(8px)}45%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.an-img{height:60px;display:flex;align-items:center;justify-content:center;font-size:42px}
.badge{position:absolute;top:-8px;right:-6px;width:30px;height:30px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.an-card button{background:#1A1A2E;color:#fff;border:none;border-radius:20px;padding:7px 0;font-size:11px;font-weight:900;width:100%;margin-top:5px;letter-spacing:.5px;pointer-events:none}
.domanda{background:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-top:18px;box-shadow:0 3px 0 #F0E6D8}
.domanda .ico{width:48px;height:48px;background:#F3E8FF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.domanda p{font-size:17px;font-weight:800;color:#2D2D4A}
.btn-chi{width:100%;background:#7B5CFF;color:#fff;border:none;border-radius:20px;padding:18px 20px;font-size:22px;font-weight:900;margin-top:16px;box-shadow:0 6px 0 #5A3ED6;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.btn-chi:active{transform:translateY(4px);box-shadow:0 2px 0 #5A3ED6}
.hint-text{text-align:center;color:#9A8AB8;font-weight:700;font-size:13px;margin-top:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.btn-b{background:#fff;border:1.5px solid #F0E6D8;border-radius:20px;padding:14px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #F0E6D8;display:flex;align-items:center;justify-content:center;gap:8px;color:#3A3A5A;cursor:pointer}
.footer{margin-top:28px;text-align:center;padding-bottom:20px}
.footer .brand{font-size:13px;font-weight:900;color:#B8A8D0;letter-spacing:1px}
.msg{margin-top:14px;border-radius:18px;padding:14px 16px;animation:pop .35s;border:2.5px solid #2D2D4A}
.msg.err{background:#FFF3A0} .msg.err p{color:#5A3A00}
.msg.bravo{background:#C8FFD0} .msg.bravo p{color:#1A5A2A}
.msg p{font-weight:800;font-size:14px;line-height:1.3}
.conf{position:absolute;top:-10px;width:9px;height:12px;z-index:30;animation:caduta linear forwards}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pop{0%{transform:scale(.88)}100%{transform:scale(1)}}
@keyframes caduta{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(380px) rotate(720deg);opacity:0}}
#confetti-wrap{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px;z-index:10}
</style>
</head>
<body>

<div class="card-top" id="scena">
  <div class="nuv"></div><div class="nuv2"></div>
  <div class="sole-wrap"><div class="sole">
    <div class="raggio r1"></div><div class="raggio r2"></div><div class="raggio r3"></div><div class="raggio r4"></div>
    <div class="raggio r5"></div><div class="raggio r6"></div><div class="raggio r7"></div><div class="raggio r8"></div>
    <div class="faccia"><div class="occhi">● ●</div><div class="guance"><span></span><span></span></div><div class="bocca">⌣</div></div>
  </div></div>
  <div class="fienile-wrap"><div class="fienile"><div class="tetto"></div><div class="cuore">♡</div><div class="fin sx"></div><div class="fin dx"></div><div class="porta"></div></div></div>
  <div class="prato"></div>
  <div class="animali">
    <div class="an-card" id="card-mucca" onclick="clickAnimale('mucca')"><div class="badge">🌻</div><div class="an-img">🐄</div><button>MUCCA</button></div>
    <div class="an-card" id="card-maialino" onclick="clickAnimale('maialino')"><div class="badge">🍓</div><div class="an-img">🐷</div><button>MAIALINO</button></div>
    <div class="an-card" id="card-gallo" onclick="clickAnimale('gallo')"><div class="badge">🌽</div><div class="an-img">🐔</div><button>GALLO</button></div>
  </div>
  <div id="confetti-wrap"></div>
</div>

<div class="domanda"><div class="ico">👂</div><p>Quale animale fa questo verso?</p></div>
<div id="msg-area"></div>

<button class="btn-chi" id="btnChi" onclick="iniziaGioco()">🔊 Chi è? ▶</button>
<div class="hint-text" id="hintText">Prima tocca gli animali per sentire i versi, poi premi Chi è?</div>
<div class="row2">
  <button class="btn-b" onclick="aiutami()">💡 Aiutami</button>
  <button class="btn-b" onclick="riAscolta()">🔊 Riascolta</button>
</div>

<div class="footer"><div class="brand">l'Orecchio inCanto.it</div></div>

<script>
const suoni = {
  mucca: new Audio('mucca.mp3'),
  maialino: new Audio('maialino.mp3'),
  gallo: new Audio('gallo.mp3')
};
let segreto=null;
let giocoAttivo=false;
let timer=null;

function nuovoSegreto(){
  const a=['mucca','maialino','gallo'];
  segreto=a[Math.floor(Math.random()*a.length)];
}
function suona(nome){
  try{ suoni[nome].currentTime=0; suoni[nome].play(); }catch(e){}
}
function mostra(tipo, testo, dura){
  clearTimeout(timer);
  const ar=document.getElementById('msg-area');
  ar.innerHTML='<div class="msg '+tipo+'"><p>'+testo+'</p></div>';
  if(dura){ timer=setTimeout(()=>{ar.innerHTML='';}, dura); }
}

// FASE 1: esplora - clicchi animali senti solo loro verso
function clickAnimale(nome){
  if(!giocoAttivo){
    // solo esplorazione
    suona(nome);
    return;
  }
  // FASE 2: gioco attivo - controlli se è giusto, senza suonare altri versi
  if(nome===segreto){
    // giusto
    const wrap=document.getElementById('confetti-wrap');
    const colori=['#FF4B4B','#FFD93D','#7B5CFF','#4DFF88','#4DB8FF'];
    for(let i=0;i<60;i++){
      const d=document.createElement('div'); d.className='conf';
      d.style.left=Math.random()*100+'%';
      d.style.background=colori[Math.floor(Math.random()*colori.length)];
      d.style.animationDuration=(1+Math.random()*1.2)+'s';
      d.style.animationDelay=Math.random()*.2+'s';
      wrap.appendChild(d); setTimeout(()=>d.remove(),2600);
    }
    suona(nome);
    mostra('bravo','Era proprio il '+segreto.toUpperCase()+'! 🎉 Complimenti!', 3000);
    giocoAttivo=false;
    document.getElementById('btnChi').innerHTML='🔊 Chi è? ▶';
    document.getElementById('hintText').textContent='Bravo! Tocca di nuovo gli animali, poi premi Chi è?';
    setTimeout(()=>{ nuovoSegreto(); document.getElementById('msg-area').innerHTML=''; }, 3000);
  }else{
    // sbagliato - solo tremolio e messaggio, non suona altro
    const card=document.getElementById('card-'+nome);
    card.classList.add('wrong'); setTimeout(()=>card.classList.remove('wrong'),600);
    mostra('err','Non era questa! Riprova... 👂', 3500);
  }
}

function iniziaGioco(){
  nuovoSegreto();
  giocoAttivo=true;
  suona(segreto);
  document.getElementById('btnChi').innerHTML='🔊 Ascolta...';
  document.getElementById('hintText').textContent='Ascolta bene! Quale animale è? Tocca la carta giusta!';
  document.getElementById('msg-area').innerHTML='';
  setTimeout(()=>{ document.getElementById('btnChi').innerHTML='🔊 Chi è? ▶'; }, 1500);
}

function riAscolta(){
  if(!segreto){ nuovoSegreto(); }
  if(!giocoAttivo){ giocoAttivo=true; document.getElementById('hintText').textContent='Ascolta bene! Quale animale è?'; }
  suona(segreto);
}

function aiutami(){
  if(!segreto){ nuovoSegreto(); giocoAttivo=true; }
  const c=document.getElementById('card-'+segreto);
  c.classList.add('hint'); setTimeout(()=>c.classList.remove('hint'),1100);
  mostra('err','Guarda bene... si muove un pochino! ✨', 3000);
}

nuovoSegreto();
</script>
</body>
</html>
