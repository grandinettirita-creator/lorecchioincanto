<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alla Fattoria - Play OI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,'Nunito',sans-serif;background:#EAF2FF;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:34px;font-weight:900;color:#1E2A5A} h1 span{color:#7C5CFC}
.sub{color:#8A8FB8;font-weight:800;font-size:16px;margin-bottom:16px}
.wrap{width:100%;max-width:420px;background:#D6E9FF;border-radius:32px;padding:10px;border:3px solid #fff;box-shadow:0 12px 32px rgba(0,0,0,.08)}
.scene{background:#B8DCFF;border-radius:24px;position:relative;overflow:hidden;height:360px}
.sun{position:absolute;top:14px;right:18px;width:72px;height:72px;background:#FFE066;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;animation:spin 8s linear infinite;box-shadow:0 0 0 8px rgba(255,224,102,.4)}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.cloud{position:absolute;background:#fff;border-radius:999px}
.c1{width:64px;height:26px;top:30px;left:22px}
.c2{width:44px;height:18px;top:54px;left:50%;opacity:.7}
.hill1{position:absolute;bottom:92px;left:-20px;right:-20px;height:86px;background:#A8D8EA;border-radius:60% 60% 0 0}
.hill2{position:absolute;bottom:0;left:0;right:0;height:124px;background:#C5E8B7}
.barn{position:absolute;bottom:116px;left:50%;transform:translateX(-50%);width:176px;height:88px;background:#FF5A5A;border-radius:20px 20px 0 0;border:3px solid #fff}
.barnDoor{position:absolute;bottom:-36px;left:50%;transform:translateX(-50%);width:78px;height:38px;background:#FFF4CC;border:3px solid #fff;border-radius:10px 10px 0 0}
.heart{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:16px}
.grass{position:absolute;bottom:88px;left:0;right:0;height:30px;background:#8FD67A}
.cards{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:10px}
.card{flex:1;background:#fff;border-radius:22px;padding:10px 6px 10px;border:3px solid #fff;text-align:center;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.08),0 12px 24px rgba(0,0,0,.08);transition:.15s}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.card.sel{border-color:#7C5CFC;transform:translateY(-3px);box-shadow:0 12px 0 rgba(124,92,252,.25),0 18px 32px rgba(124,92,252,.2)}
.em{font-size:46px;line-height:1}
.lab{margin-top:8px;background:#2D324A;color:#fff;font-size:12px;font-weight:900;padding:9px 0;border-radius:999px}
.msg{width:100%;max-width:420px;margin-top:18px;background:#fff;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.ico{width:54px;height:54px;background:#EDE7FF;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.msg p{font-weight:900;color:#2D324A;font-size:19px}
.btnMain{width:100%;max-width:420px;margin-top:16px;background:#7C5CFC;color:#fff;font-weight:900;font-size:22px;padding:16px;border-radius:999px;border:none;box-shadow:0 8px 0 #5A3FC0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:.15s}
.btnMain:active{transform:translateY(4px);box-shadow:0 2px 0 #5A3FC0}
.btnRow{width:100%;max-width:420px;margin-top:14px;display:flex;gap:12px}
.btnSec{flex:1;background:#fff;border:none;padding:14px;border-radius:999px;font-weight:900;color:#5A5F8A;box-shadow:0 6px 0 #D6DAE8;cursor:pointer}
.ok{background:#D1FAE5!important;border:2px solid #6EE7B7}
.ko{background:#FFE4E6!important;border:2px solid #FDA4AF}
</style>
</head>
<body>
<h1>Alla <span>Fattoria</span></h1>
<div class="sub">Tocca, ascolta e indovina!</div>
<div class="wrap"><div class="scene">
<div class="sun">☀️</div>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="hill1"></div><div class="hill2"></div>
<div class="grass"></div>
<div class="barn"><div class="heart">🤍</div><div class="barnDoor"></div></div>
<div class="cards">
<div id="card-mucca" class="card" onclick="checkAnswer('mucca')"><div class="em">🐄</div><div class="lab">MUCCA</div></div>
<div id="card-maialino" class="card" onclick="checkAnswer('maialino')"><div class="em">🐷</div><div class="lab">MAIALINO</div></div>
<div id="card-gallo" class="card" onclick="checkAnswer('gallo')"><div class="em">🐓</div><div class="lab">GALLO</div></div>
</div>
</div></div>
<div id="messageBox" class="msg"><div class="ico">👂</div><p id="messageText">Quale animale fa questo verso?</p></div>
<button class="btnMain" onclick="playCurrent()">🔊 Chi è?</button>
<div class="btnRow"><button class="btnSec" onclick="helpMe()">💡 Aiutami</button><button class="btnSec" onclick="playCurrent()">🔄 Riascolta</button></div>
<audio id="audio-mucca" src="mucca.mp3" preload="auto"></audio>
<audio id="audio-maialino" src="maialino.mp3" preload="auto"></audio>
<audio id="audio-gallo" src="gallo.mp3" preload="auto"></audio>
<script>
const animals=['mucca','maialino','gallo'];let current=null;
function pickRandom(){current=animals[Math.floor(Math.random()*animals.length)];document.getElementById('messageText').textContent='Quale animale fa questo verso?';document.getElementById('messageBox').className='msg';document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));}
function playCurrent(){if(!current)pickRandom();const a=document.getElementById('audio-'+current);if(!a){alert('File '+current+'.mp3 non trovato!');return;}a.currentTime=0;a.play().catch(()=>{});document.getElementById('messageText').textContent='Ascolta bene... 👂';}
function checkAnswer(choice){if(!current){pickRandom();playCurrent();return;}document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));document.getElementById('card-'+choice).classList.add('sel');if(choice===current){document.getElementById('messageText').textContent='Bravo! Il '+choice+'! 🎉';document.getElementById('messageBox').className='msg ok';setTimeout(pickRandom,1500);}else{document.getElementById('messageText').textContent='Riascolta... non è '+choice+'! 👂';document.getElementById('messageBox').className='msg ko';}}
function helpMe(){if(!current)pickRandom();const hints={mucca:'Fa muuuu, bianca e nera 🐄',maialino:'Fa oinc oinc, rosa 🐷',gallo:'Fa chicchirichì al mattino 🐓'};document.getElementById('messageText').textContent=hints[current];}
pickRandom();
</script>
</body>
</html>
